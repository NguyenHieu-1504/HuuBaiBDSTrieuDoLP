<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liền kề Phố Vịnh - Gallery</title>
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#071018;color:#fff}
  .hero{padding:40px;text-align:center}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
  .grid img{width:100%;height:320px;object-fit:cover;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.6);transition:transform .35s ease,box-shadow .35s ease;cursor:pointer}
  .grid img:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 28px 44px -18px rgba(0,0,0,.6)}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s}
  .lightbox.in{opacity:1;pointer-events:auto}
  .lightbox img{max-width:94%;max-height:90%;border-radius:6px;box-shadow:0 30px 60px rgba(0,0,0,.6)}
  .lightbox .close{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.06);border:none;color:#fff;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:700}
  .lightbox .prev,.lightbox .next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.35);border:none;color:#fff;padding:14px 16px;border-radius:8px;cursor:pointer;font-size:22px}
  .lightbox .prev{left:18px}
  .lightbox .next{right:18px}
  .lightbox .caption{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;color:rgba(255,255,255,.95);font-size:15px;padding:8px 14px;background:rgba(0,0,0,.35);border-radius:8px;max-width:86%;text-align:center}
  a.back{display:inline-block;margin-top:16px;color:#fff;background:rgba(255,255,255,.06);padding:10px 14px;border-radius:8px;text-decoration:none}
  @media(max-width:860px){.grid{grid-template-columns:1fr}} 
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>Liền kề Phố Vịnh</h1>
      <p>Minh họa không gian liền kề, mặt phố và tiện ích cửa hàng.</p>
      <a class="back" href="Landing01.html">← Trở về trang chính</a>
    </div>
    <div class="grid">
      <img src="imgs/z7970012095584_d9df43fa1fcff88848b623763dc170de.jpg" alt="Liền kề mặt phố">
      <img src="imgs/z7970009741084_fbf6f71933115259845949279c7b7257.jpg" alt="Không gian nội thất">
      <img src="imgs/z7953882519125_2e6082c541ec12799323aa14dbd566a9.jpg" alt="Tiện ích phố">
    </div>
  </div>
<script>
(() => {
  const imgs = Array.from(document.querySelectorAll('.grid img'));
  const items = imgs.map(i=>({src:i.src, caption:i.alt||i.title||''}));
  if(!items.length) return;
  const lb = document.createElement('div'); lb.className = 'lightbox';
  lb.innerHTML = '<button class="close" aria-label="Đóng">✕</button><button class="prev" aria-label="Trước">‹</button><img src="" alt=""><button class="next" aria-label="Sau">›</button><div class="caption"></div>';
  document.body.appendChild(lb);
  const img = lb.querySelector('img');
  const closeBtn = lb.querySelector('.close');
  const prevBtn = lb.querySelector('.prev');
  const nextBtn = lb.querySelector('.next');
  const captionEl = lb.querySelector('.caption');
  let idx = 0;
  function open(i){ idx = i; img.src = items[idx].src; captionEl.textContent = items[idx].caption||''; lb.classList.add('in'); }
  function close(){ lb.classList.remove('in'); setTimeout(()=>img.src='','200'); }
  function next(){ open((idx+1)%items.length); }
  function prev(){ open((idx-1+items.length)%items.length); }
  closeBtn.addEventListener('click', close);
  nextBtn.addEventListener('click', (e)=>{ e.stopPropagation(); next(); });
  prevBtn.addEventListener('click', (e)=>{ e.stopPropagation(); prev(); });
  lb.addEventListener('click', e=>{ if(e.target === lb) close(); });
  document.addEventListener('keydown', e=>{ if(e.key === 'Escape') close(); if(e.key==='ArrowRight') next(); if(e.key==='ArrowLeft') prev(); });
  imgs.forEach((el,i)=> el.addEventListener('click', ()=> open(i)) );
})();
</script>
</body>
</html>
